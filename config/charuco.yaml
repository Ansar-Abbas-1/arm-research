# The printed ChArUco board used for the camera-mount calibration (docs/charuco_mount_calibration.md).
# Print it from the SVG made by `rosrun arm_camera make_charuco_board.py` at 100 % ("actual size"),
# glue it flat on a rigid plate, then MEASURE a printed square and the black marker inside it and edit the
# two lengths below to the measured values (in metres): they set the scale of the whole calibration.
squares_x: 9            # squares along the board's x axis (columns)
squares_y: 7            # squares along y (rows)
square_length: 0.025    # edge of one chessboard square [m], measured 25 mm (2026-10-06)
marker_length: 0.014    # edge of the black ArUco marker inside a white square [m], 14 mm as given by the operator
dictionary: 6X6_250     # confirmed by the operator; identified from a live frame on 2026-10-06 (6X6_50 reads the same first ids)
