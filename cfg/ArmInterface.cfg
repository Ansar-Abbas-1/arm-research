#!/usr/bin/env python3
PACKAGE = "arm_interface"

from dynamic_reconfigure.parameter_generator_catkin import ParameterGenerator, double_t

gen = ParameterGenerator()

gen.add("command_timeout", double_t, 0,
        "Watchdog: max seconds with no /joint_states_out command before torque is disabled. Must be > 0.",
        0.5, 0.05, 5.0)

exit(gen.generate(PACKAGE, "robot_interface", "ArmInterface"))
